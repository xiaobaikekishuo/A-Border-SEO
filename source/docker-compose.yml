# Self-hosting with Docker Compose (Linux server or any Docker host):
#   cp .env.example .env    # then fill in the required values
#   docker compose up -d --build
# On Windows, the kit in windows/ adds backups, a dedicated database volume and
# the local Codex helpers on top of the same image.
services:
  app:
    image: ${ABORDER_SEO_IMAGE:-a-border-seo:1.1.2}
    build: .
    restart: always
    # Schema migrations first, then the web app. Back up the database before
    # moving to a new image.
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node server.js"]
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aborder}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aborder}
      # The worker service below runs crawls, syncs and the schedule; the app
      # only queues them. Without a worker, remove this line (the default,
      # inline, runs jobs in the app).
      WORKER_MODE: "off"

  # Runs queued jobs (crawls, vitals checks, GSC and Bing syncs, alerts) and
  # the schedule, from the same image. Serves no HTTP.
  worker:
    image: ${ABORDER_SEO_IMAGE:-a-border-seo:1.1.2}
    build: .
    restart: always
    command: ["node", "worker.cjs"]
    env_file:
      - path: .env
        required: false
    depends_on:
      # The app applies the database migrations when it starts.
      app:
        condition: service_healthy
    # SIGTERM lets running syncs finish (WORKER_SHUTDOWN_GRACE_SECONDS, 25 s by
    # default) and puts a running crawl back in the queue.
    stop_grace_period: 40s
    healthcheck:
      # The worker touches this file while it reaches the database.
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.exit(Date.now()-require('fs').statSync('/tmp/worker-alive').mtimeMs<60000?0:1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aborder}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aborder}
      WORKER_MODE: worker

  db:
    image: postgres:16-alpine
    restart: always
    ports:
      # Loopback only, for host-side tools (prisma migrate dev, psql). The app
      # reaches the database as db:5432 over the compose network. Never publish
      # it as "5432:5432": that binds every interface of the host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aborder}
      POSTGRES_USER: ${POSTGRES_USER:-aborder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
