name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    # A real PostgreSQL server for the tests PGlite cannot cover (concurrent job
    # claims, lib/jobs/claim.pg.test.ts). Nothing else uses it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aborder
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aborder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aborder -d aborder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Lints the .ts/.tsx files this push or pull request changes.
      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          FILES=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.ts' '*.tsx' || true)
          if [ -z "$FILES" ]; then
            echo "No .ts/.tsx files changed; skipping lint"
          else
            echo "$FILES" | xargs npx eslint
          fi

      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://aborder:ci-only@localhost:5432/aborder_test

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://aborder:ci-only@localhost:5432/aborder_test
